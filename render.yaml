services:
  - type: web
    name: arcade-archives
    runtime: python
    region: oregon # pick your nearest region
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      # Render's disk is wiped on every deploy/restart (and the free plan has no
      # persistent disk), so keep app data in PostgreSQL, e.g. a free Neon database.
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: ADMIN_USERS
        value: admin
      # Needed for profile photos and Constellation file sharing to survive restarts.
      - key: CLOUDINARY_URL
        sync: false
      - key: CAFE_OPEN
        value: "10:00"
      - key: CAFE_CLOSE
        value: "22:00"
      - key: CAFE_SLOT_STEP_MIN
        value: "60"
      - key: CAFE_DEFAULT_DURATION
        value: "60"
      - key: CAFE_SLOT_CAPACITY
        value: "10"
      - key: USD_TO_INR
        value: "83"
