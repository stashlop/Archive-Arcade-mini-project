<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cafe - Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='arcade.css') }}" />
  <style>
    .cafe-grid { display: grid; gap: 1.2rem; }
    .row { display:flex; gap:.6rem; align-items:center; flex-wrap: wrap; }
    .form-grid { margin-top: .9rem; }
    .form-actions { display:flex; gap:.6rem; flex-wrap:wrap; }
    .booking-row { display:flex; gap:.6rem; align-items:center; justify-content:space-between; flex-wrap:wrap; padding:.6rem 0; border-bottom:1px solid var(--line); }
    .booking-row:last-child { border-bottom:0; }
    .badge.ok { background: rgba(34,197,94,.2); border:1px solid rgba(34,197,94,.5); }
    .badge.members { background: rgba(245,158,11,.2); border:1px solid rgba(245,158,11,.5); }
    .badge.sold { background: rgba(239,68,68,.2); border:1px solid rgba(239,68,68,.5); }
  </style>
</head>
<body class="antialiased">
  {% include 'partials/header.html' %}

  <main class="page-shell" id="main">
    <header class="page-header">
      <p class="badge">Cafe & Lounge</p>
      <h1 class="page-title">Book a Session</h1>
      <p class="page-subtitle">Reserve tables, track bookings, and check daily availability.</p>
    </header>

    <section class="cafe-grid">
      <div class="section-card">
        <h2>Availability & Slots</h2>
        <p class="page-subtitle">Saturdays are members-only esports events. Sundays are closed.</p>
        <div class="form-grid">
          <div class="field-stack">
            <label for="when">Date</label>
            <input id="when" type="date" />
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-primary" onclick="checkCafe()">Check</button>
            <button type="button" class="btn btn-ghost" onclick="loadSlots()">Load Slots</button>
          </div>
        </div>
        <div id="status" class="status-msg" role="status" aria-live="polite"></div>
        <div id="slots" class="status-msg" aria-live="polite"></div>
      </div>

      <div class="section-card">
        <h2>Book a Slot</h2>
        <p class="page-subtitle">Choose time, party size, and duration.</p>
        <div class="form-grid">
          <div class="field-stack">
            <label for="slot-time">Time</label>
            <select id="slot-time"><option value="">Load slots first</option></select>
          </div>
          <div class="field-stack">
            <label for="party">Party size</label>
            <input id="party" type="number" min="1" max="10" value="1" inputmode="numeric" />
          </div>
          <div class="field-stack">
            <label for="duration">Duration</label>
            <select id="duration">
              <option value="60">60 min</option>
              <option value="90">90 min</option>
              <option value="120">120 min</option>
            </select>
          </div>
        </div>
        <div class="form-grid">
          <div class="field-stack" style="grid-column: 1 / -1;">
            <label for="note">Note</label>
            <input id="note" type="text" placeholder="Optional note" maxlength="500" />
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-accent" id="reserve-btn" onclick="bookCafe()">Reserve</button>
          </div>
        </div>
        <div id="book-msg" class="status-msg" role="status" aria-live="polite"></div>
      </div>

      <div class="section-card">
        <h2>Your Bookings</h2>
        <div id="my-bookings" class="page-subtitle" aria-live="polite">Loading...</div>
      </div>
    </section>
  </main>

  <script>
    function fmt(d){
      const z = n => n.toString().padStart(2,'0');
      return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
    }
    function initDate(){
      const input = document.getElementById('when');
      if (!input) return;
      input.min = fmt(new Date());
      if (!input.value) input.value = fmt(new Date());
      input.addEventListener('change', () => { checkCafe(); loadSlots(); });
    }
    function setMsg(el, text, kind){
      el.textContent = text;
      el.className = 'status-msg' + (kind ? ' is-' + kind : '');
    }
    async function checkCafe(){
      const input = document.getElementById('when');
      const out = document.getElementById('status');
      if (!input || !input.value) { out.textContent = 'Select a date first.'; return; }
      out.textContent = 'Checking...';
      try{
        const r = await fetch(`/api/cafe/availability?date=${encodeURIComponent(input.value)}`);
        const d = await r.json();
        if (!r.ok){ out.textContent = d.error || 'Error'; return; }
        let html = '';
        if (d.status === 'available') {
          html = `Available <span class="badge ok">All welcome</span>`;
        } else if (d.status === 'members_only') {
          html = `Members-only <span class="badge members">Esports day</span>`;
        } else if (d.status === 'sold_out') {
          html = `Fully booked <span class="badge sold">Closed</span>`;
        } else {
          html = escapeHtml(d.note || 'Unknown status');
        }
        out.innerHTML = html;
      }catch(e){
        out.textContent = 'Failed to check availability.';
      }
    }
    async function loadSlots(){
      const date = document.getElementById('when')?.value;
      const out = document.getElementById('slots');
      const timeSel = document.getElementById('slot-time');
      if (!date){ out.textContent = 'Select a date first.'; return; }
      out.textContent = 'Loading slots...';
      timeSel.innerHTML = '';
      try {
        const r = await fetch(`/api/cafe/slots?date=${encodeURIComponent(date)}`);
        const d = await r.json();
        if (!r.ok){ out.textContent = d.error || 'Failed to load slots'; return; }
        if (d.closed){ out.textContent = 'Closed on this day.'; return; }
        if (d.members_only){ out.textContent = 'Members-only esports event day.'; return; }
        if (!d.slots || !d.slots.length){ out.textContent = 'No slots available.'; return; }
        out.textContent = `Capacity per slot: ${d.capacity}. Default duration: ${d.duration} minutes.`;
        d.slots.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.time; opt.textContent = `${s.time} - ${s.remaining} seats left`;
          if (s.remaining <= 0) opt.disabled = true;
          timeSel.appendChild(opt);
        });
      } catch(e){
        out.textContent = 'Failed to load slots.';
      }
    }

    async function refreshMyBookings(){
      const box = document.getElementById('my-bookings');
      try{
        const r = await fetch('/api/cafe/bookings');
        const d = await r.json();
        if (!r.ok) { box.textContent = d.error || 'Failed to load'; return; }
        if (!d.length){ box.textContent = 'No bookings yet.'; return; }
        box.innerHTML = '';
        d.forEach(b => {
          const row = document.createElement('div');
          row.className = 'booking-row';
          const text = document.createElement('span');
          text.textContent = `#${b.id} - ${b.date} ${b.time} - party ${b.party_size} - ${b.status}`;
          row.appendChild(text);
          if (b.status === 'confirmed'){
            const btn = document.createElement('button'); btn.textContent = 'Cancel'; btn.className = 'btn btn-ghost';
            btn.setAttribute('aria-label', `Cancel booking ${b.id}`);
            btn.onclick = async ()=>{
              if (!confirm('Cancel this booking?')) return;
              btn.disabled = true;
              try {
                await readJson(await fetch(`/api/cafe/bookings/${encodeURIComponent(b.id)}`, { method:'DELETE' }));
                refreshMyBookings(); loadSlots();
              } catch (e) {
                alert(e.message || 'Cancel failed');
                btn.disabled = false;
              }
            };
            row.appendChild(btn);
          }
          box.appendChild(row);
        });
      }catch(e){
        box.textContent = 'Failed to load';
      }
    }

    async function bookCafe(){
      const date = document.getElementById('when')?.value;
      const time = document.getElementById('slot-time')?.value;
      const party = Number(document.getElementById('party')?.value || '1');
      const duration = Number(document.getElementById('duration')?.value || '60');
      const note = document.getElementById('note')?.value || '';
      const out = document.getElementById('book-msg');
      const btn = document.getElementById('reserve-btn');
      if (!date || !time){ setMsg(out, 'Please pick a date and load slots, then choose a time.', 'error'); return; }
      if (!Number.isInteger(party) || party < 1){ setMsg(out, 'Party size must be at least 1.', 'error'); return; }
      setMsg(out, 'Submitting...');
      btn.disabled = true;
      try{
        const r = await fetch('/api/cafe/book', {
          method: 'POST', headers: { 'Content-Type':'application/json' },
          body: JSON.stringify({ date, time, partySize: party, duration, note })
        });
        let d = {};
        try { d = await r.json(); } catch (e) {}
        if (!r.ok){ setMsg(out, (d.error || 'Booking failed') + (d.remaining !== undefined ? ` (remaining: ${d.remaining})` : ''), 'error'); return; }
        setMsg(out, `Booking confirmed (#${d.booking_id}) for ${date} at ${time}`, 'success');
        refreshMyBookings(); loadSlots();
      }catch(e){
        setMsg(out, 'Network error - your booking was not saved. Please try again.', 'error');
      } finally {
        btn.disabled = false;
      }
    }
    function init(){
      initDate();
      checkCafe();
      loadSlots();
      refreshMyBookings();
    }
    init();
  </script>
</body>
</html>
